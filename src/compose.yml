services:
  # --- worker ---
  worker:
    image: stos_worker
    restart: always
    build:
      dockerfile: worker/dockerfile
    volumes:
      - ${STOS_FILES}:/workers:rw
      - ${DOCKER_SOCK}:/var/run/docker.sock:rw
    environment:
      - WORKERS_DATA_LOCAL_PATH=/workers
      - WORKERS_DATA_HOST_PATH=${STOS_FILES}
      - EXEC_IMAGE_NAME=${EXEC_IMAGE_NAME}
      - JUDGE_IMAGE_NAME=${JUDGE_IMAGE_NAME}
      
      - GUI_URL=${GUI_URL}
      - LOKI_URL=${LOKI_URL}
      
      - QUEUE_COMPILER_DICT=${QUEUE_COMPILER_DICT}
      - STOS_GID=${STOS_GID}
      - IS_DEBUG_MODE_ENABLED=${IS_DEBUG_MODE_ENABLED}
    group_add:  
      - ${DOCKER_GID}
      - ${STOS_GID}
    deploy:
      mode: replicated
      replicas: 4

  # gui_mock:
  #   image: gui_mock
  #   build:
  #     dockerfile: gui_mock/dockerfile
  #   ports:
  #     - "8080:80"






  # --- NODE EXPORTER (monitoring hosta) ---
  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    ports:
      - "9100:9100"
    pid: host
    restart: unless-stopped


  # --- cADVISOR (monitoring kontenerów) ---
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8080:8080"
    restart: unless-stopped

